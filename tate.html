<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Kenyan Kiosk Shelf</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top, #5e7488 0%, #3e4d5c 35%, #212a33 100%);
    overflow-x:hidden;
    perspective:1600px;
}

.header{
    width:100%;
    padding:22px;
    text-align:center;
    color:white;
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
    text-shadow:0 3px 10px rgba(0,0,0,0.5);
}

.scene{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 20px 100px;
}

/* MAIN 3D SHOP */
.shop{
    position:relative;
    width:1200px;
    max-width:100%;
    transform-style:preserve-3d;
    transform:rotateX(10deg);
}

/* WOODEN FRAME */
.frame{
    position:relative;
    background:linear-gradient(to bottom,#8b5a2b,#5f3818);
    border-radius:16px;
    padding:40px 30px 50px;
    box-shadow:
        0 60px 80px rgba(0,0,0,0.55),
        inset 0 0 20px rgba(255,255,255,0.08),
        inset 0 -10px 20px rgba(0,0,0,0.3);

    transform-style:preserve-3d;
}

/* SIDE DEPTH */
.frame::before,
.frame::after{
    content:"";
    position:absolute;
    top:12px;
    width:22px;
    height:100%;
    background:#4a2910;
}

.frame::before{
    left:-22px;
    transform:rotateY(90deg);
    transform-origin:right;
}

.frame::after{
    right:-22px;
    transform:rotateY(-90deg);
    transform-origin:left;
}

/* SHELVES */
.shelf{
    position:relative;
    height:230px;
    margin-bottom:70px;
    background:
      linear-gradient(to bottom,#9a6332,#6d3f18);

    border-radius:8px;
    display:flex;
    justify-content:space-evenly;
    align-items:flex-end;
    padding:25px;

    box-shadow:
      inset 0 8px 8px rgba(255,255,255,0.12),
      inset 0 -8px 10px rgba(0,0,0,0.35),
      0 25px 30px rgba(0,0,0,0.35);

    transform-style:preserve-3d;
}

/* FRONT THICKNESS */
.shelf::after{
    content:"";
    position:absolute;
    bottom:-20px;
    left:0;
    width:100%;
    height:20px;
    background:#4b2810;
    transform:rotateX(-90deg);
    transform-origin:top;
}

/* PARTITIONS */
.partition{
    width:10px;
    height:100%;
    background:linear-gradient(to right,#4b2810,#7d4c24);
    border-radius:4px;
    box-shadow:4px 0 8px rgba(0,0,0,0.3);
}

/* PRODUCT */
.product{
    width:170px;
    height:180px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    cursor:pointer;
    transition:0.35s;
    transform-style:preserve-3d;
}

.product:hover{
    transform:
      translateY(-14px)
      translateZ(30px)
      scale(1.08);
}

.product img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:
      drop-shadow(0 18px 12px rgba(0,0,0,0.45));
}

/* FLOOR SHADOW */
.floor-shadow{
    position:absolute;
    bottom:-70px;
    left:50%;
    transform:translateX(-50%) rotateX(80deg);
    width:92%;
    height:90px;
    background:rgba(0,0,0,0.45);
    filter:blur(35px);
    border-radius:50%;
}

/* WINDOW */
.window{
    height:150px;
    border-radius:14px;
    background:
      linear-gradient(to bottom,#4b2a11,#2e1708);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:26px;
    font-weight:bold;
    letter-spacing:2px;

    box-shadow:
      inset 0 6px 10px rgba(255,255,255,0.08),
      inset 0 -10px 12px rgba(0,0,0,0.45),
      0 18px 25px rgba(0,0,0,0.35);
}

/* OVERLAY */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    z-index:100;
    backdrop-filter:blur(4px);
}

.overlay.active{
    display:block;
}

/* SIDE PANEL */
.panel{
    position:fixed;
    top:0;
    right:-460px;
    width:430px;
    height:100vh;
    background:#ffffff;
    z-index:101;
    transition:0.45s;
    padding:28px;
    overflow-y:auto;

    box-shadow:-20px 0 40px rgba(0,0,0,0.35);
}

.panel.active{
    right:0;
}

.close-btn{
    position:absolute;
    right:20px;
    top:14px;
    font-size:34px;
    cursor:pointer;
    color:#444;
}

.panel h2{
    font-size:30px;
    margin-bottom:10px;
    color:#222;
}

.desc{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

.preview{
    width:100%;
    text-align:center;
    margin:25px 0;
}

.preview img{
    width:240px;
    height:240px;
    object-fit:contain;
    filter:drop-shadow(0 10px 15px rgba(0,0,0,0.3));
}

.price{
    font-size:34px;
    font-weight:bold;
    color:#111;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

select,
input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}

.order-btn{
    width:100%;
    border:none;
    padding:18px;
    border-radius:12px;
    background:#1f9d57;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.order-btn:hover{
    transform:translateY(-2px);
    background:#167944;
}

@media(max-width:900px){

    .shop{
        transform:none;
    }

    .panel{
        width:100%;
    }

    .shelf{
        overflow-x:auto;
        justify-content:flex-start;
        gap:30px;
    }

    .product{
        min-width:150px;
    }

}

</style>
</head>
<body>

<div class="scene">

    <div class="shop">

            <!-- SHELF 1 -->
            <div class="shelf">

<!-- PANEL -->
<div class="panel" id="panel">

    <div class="close-btn" id="closeBtn">&times;</div>

    <h2 id="productName">Product</h2>

    <p class="desc">
        Select your preferred size, quantity and packaging before placing your order.
    </p>

    <div class="preview">
        <img id="previewImage" src="">
    </div>

    <div class="price" id="productPrice">
        KES 0
    </div>

    <div class="form-group">
        <label>Packaging Color</label>

        <select id="color">
            <option>Original</option>
            <option>Red</option>
            <option>Blue</option>
            <option>Green</option>
        </select>
    </div>

    <div class="form-group">
        <label>Size</label>

        <select id="size">
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
        </select>
    </div>

    <div class="form-group">
        <label>Quantity</label>

        <input type="number" id="quantity" value="1" min="1">
    </div>

    <button class="order-btn" id="orderBtn">
        Place Order
    </button>

</div>

<script>

const products = document.querySelectorAll('.product');

const panel = document.getElementById('panel');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');

const productName = document.getElementById('productName');
const productPrice = document.getElementById('productPrice');
const previewImage = document.getElementById('previewImage');

const color = document.getElementById('color');
const size = document.getElementById('size');
const quantity = document.getElementById('quantity');

const orderBtn = document.getElementById('orderBtn');

let currentProduct = '';

products.forEach(product => {

    product.addEventListener('click', () => {

        currentProduct = product.dataset.name;

        productName.textContent = product.dataset.name;

        productPrice.textContent = product.dataset.price;

        previewImage.src = product.dataset.image;

        panel.classList.add('active');
        overlay.classList.add('active');

    });

});

function closePanel(){

    panel.classList.remove('active');
    overlay.classList.remove('active');

}

closeBtn.addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);

orderBtn.addEventListener('click', () => {

    alert(
        'ORDER PLACED SUCCESSFULLY!\n\n' +
        'Product: ' + currentProduct + '\n' +
        'Packaging: ' + color.value + '\n' +
        'Size: ' + size.value + '\n' +
        'Quantity: ' + quantity.value
    );

    closePanel();

});

</script>
