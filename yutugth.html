<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MarketHub Products</title>


    <!-- =====================================================
         POPPINS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           GLOBAL
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: "Poppins", sans-serif;

            background: #f5f5f5;

            color: #222;

        }


        /* =====================================================
           WRAPPER
        ====================================================== */

        .products-wrapper {

            width: 100%;

            max-width: 1299px;

            margin: 0 auto;

            padding: 25px;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .products-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;

        }


        .products-title {

            font-size: 21px;

            font-weight: 600;

        }


        .products-count {

            font-size: 13px;

            color: #898888;

        }


        /* =====================================================
           PRODUCTS GRID

           9 PRODUCT CARDS + 1 NAVIGATION CARD
        ====================================================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(100px, 1fr)
                );

            gap: 15px;

            width: 100%;

        }


        /* =====================================================
           PRODUCT CARD
        ====================================================== */

        .product-card {

            position: relative;

            min-width: 0;

            aspect-ratio: 1 / 1.18;

            background: #fff;

            border: 1px solid #dedede;

            border-radius: 18px;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                border-color .2s ease;

        }


        .product-card:hover {

            transform: translateY(-3px);

            border-color: #cfcfcf;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, .08);

        }


        /* =====================================================
           PRODUCT IMAGE
        ====================================================== */

        .product-image-container {

            width: 100%;

            height: 66%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f7f7f7;

            overflow: hidden;

        }


        .product-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition:
                transform .25s ease;

        }


        .product-card:hover
        .product-image {

            transform: scale(1.04);

        }


        /* =====================================================
           PRODUCT DETAILS
        ====================================================== */

        .product-details {

            height: 34%;

            padding: 8px 10px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            gap: 2px;

        }


        .product-name {

            font-size: 12px;

            font-weight: 500;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .product-price {

            font-size: 12px;

            font-weight: 600;

        }


        .product-unit {

            font-size: 10px;

            color: #898888;

        }


        /* =====================================================
           STOCK BADGE
        ====================================================== */

        .stock-badge {

            position: absolute;

            top: 7px;

            right: 7px;

            padding: 3px 7px;

            background:
                rgba(255,255,255,.94);

            border-radius: 20px;

            font-size: 9px;

            color: #555;

            box-shadow:
                0 2px 8px rgba(0,0,0,.08);

            z-index: 2;

        }


        /* =====================================================
           NAVIGATION CARD
        ====================================================== */

        .products-navigation-card {

            aspect-ratio: 1 / 1.18;

            min-width: 0;

            border-radius: 22px;

            border: 1px solid #dedede;

            background: #fafafa;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 10px;

            user-select: none;

            transition:
                transform .22s ease,
                box-shadow .22s ease,
                border-color .22s ease,
                background .22s ease;

        }


        /* =====================================================
           NAVIGATION BUTTONS
        ====================================================== */

        .navigation-buttons {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

        }


        .navigation-button {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            border: 1px solid #dedede;

            background: #fff;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            color: #333;

            transition:
                background .2s ease,
                color .2s ease,
                border-color .2s ease,
                transform .2s ease,
                opacity .2s ease;

        }


        .navigation-button:hover:not(:disabled) {

            background: #088000;

            color: #fff;

            border-color: #088000;

            transform: translateY(-2px);

        }


        .navigation-button:active:not(:disabled) {

            transform: scale(.94);

        }


        .navigation-button:disabled {

            opacity: .35;

            cursor: default;

        }


        /* =====================================================
           NAVIGATION SVG
        ====================================================== */

        .navigation-button svg {

            width: 18px;

            height: 18px;

        }


        /* =====================================================
           PAGE INFORMATION
        ====================================================== */

        .navigation-page {

            font-size: 11px;

            font-weight: 600;

            color: #333;

        }


        .navigation-count {

            font-size: 9px;

            color: #898888;

            text-align: center;

        }


        /* =====================================================
           LOADING
        ====================================================== */

        .products-grid.loading {

            pointer-events: none;

        }


        .products-grid.loading
        .product-card {

            opacity: .55;

        }


        /* =====================================================
           PRODUCT ANIMATION
        ====================================================== */

        .product-card.product-enter {

            animation:
                productEnter
                .25s ease;

        }


        @keyframes productEnter {

            from {

                opacity: 0;

                transform:
                    translateY(8px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =====================================================
           NO PRODUCTS
        ====================================================== */

        .no-products {

            grid-column: 1 / -1;

            min-height: 180px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #898888;

            font-size: 13px;

        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 700px) {

            .products-wrapper {

                padding: 15px;

            }


            .products-grid {

                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(100px, 1fr)
                    );

                gap: 10px;

            }


            .product-card,
            .products-navigation-card {

                border-radius: 15px;

            }


            .navigation-button {

                width: 36px;

                height: 36px;

            }


            .navigation-button svg {

                width: 15px;

                height: 15px;

            }

        }


        @media (max-width: 400px) {

            .products-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(100px, 1fr)
                    );

                gap: 8px;

            }

        }

    </style>

</head>


<body>

<script>

        {

                "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80"
        },

        {
            id: 17,
            name: "Bluetooth Speaker",
            price: "KES 3,500",
            unit: "Each",
            stock: "31 in stock",
            image:
                "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=500&q=80"
        },

        {
            id: 18,
            name: "Sunglasses",
            price: "KES 1,200",
            unit: "Each",
            stock: "45 in stock",
            image:
                "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=500&q=80"
        }

    ];


    /* =========================================================
       SETTINGS
    ========================================================= */

    const PRODUCTS_PER_PAGE = 9;


    let currentPage = 1;


    const totalPages =
        Math.ceil(
            products.length /
            PRODUCTS_PER_PAGE
        );


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const productsGrid =
        document.getElementById(
            "productsGrid"
        );


    const productsCount =
        document.getElementById(
            "productsCount"
        );


    /* =========================================================
       PRODUCT CLICK
    ========================================================= */

    function selectProduct(card) {

        const productId =
            card.dataset.productId;


        console.log(
            "Selected product:",
            productId
        );


        /*
         * PUT YOUR EXISTING POS CODE HERE.
         *
         * Example:
         *
         * addProductToCheckout(productId);
         */

    }


    /* =========================================================
       CREATE PRODUCT CARD
    ========================================================= */

    function createProductCard(product) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "product-card product-enter";


        card.dataset.productId =
            product.id;


        card.onclick =
            function () {

                selectProduct(this);

            };


        card.innerHTML = `

            <div class="stock-badge">
                ${product.stock}
            </div>

            <div class="product-image-container">

                <img
                    class="product-image"
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                >

            </div>

            <div class="product-details">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-price">
                    ${product.price}
                </div>

                <div class="product-unit">
                    ${product.unit}
                </div>

            </div>

        `;


        return card;

    }


    /* =========================================================
       CREATE NAVIGATION CARD
    ========================================================= */

    function createNavigationCard() {

        const navigation =
            document.createElement(
                "div"
            );


        navigation.className =
            "products-navigation-card";


        navigation.innerHTML = `

            <div class="navigation-buttons">

                <!-- PREVIOUS -->

                <button
                    type="button"
                    class="navigation-button"
                    id="previousProducts"
                    aria-label="Previous products"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M19 12H5"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M11 6L5 12L11 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>


                <!-- NEXT -->

                <button
                    type="button"
                    class="navigation-button"
                    id="nextProducts"
                    aria-label="Next products"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M5 12H19"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                        <path
                            d="M13 6L19 12L13 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </div>


            <div
                class="navigation-page"
                id="navigationPage"
            >
                Page 1 of ${totalPages}
            </div>


            <div
                class="navigation-count"
                id="navigationCount"
            >
                9 products
            </div>

        `;


        return navigation;

    }


    /* =========================================================
       RENDER CURRENT PAGE
       
       IMPORTANT:
       
       ONLY 9 PRODUCT CARDS ARE CREATED.
       
       The previous page is completely removed from
       the DOM before the next page is displayed.
    ========================================================= */

    function renderProducts() {

        productsGrid.classList.add(
            "loading"
        );


        /*
         * Small delay gives the transition
         * a smooth professional feel.
         */

        setTimeout(function () {


            /*
             * Completely clear the current page.
             */

            productsGrid.innerHTML = "";


            /*
             * Calculate product range.
             */

            const startIndex =
                (
                    currentPage - 1
                ) *
                PRODUCTS_PER_PAGE;


            const endIndex =
                Math.min(
                    startIndex +
                    PRODUCTS_PER_PAGE,
                    products.length
                );


            /*
             * Get ONLY the products
             * belonging to this page.
             */

            const pageProducts =
                products.slice(
                    startIndex,
                    endIndex
                );


            /*
             * Render current 9 products.
             */

            pageProducts.forEach(
                function(product) {

                    productsGrid.appendChild(
                        createProductCard(
                            product
                        )
                    );

                }
            );


            /*
             * Add navigation card.
             *
             * It occupies the 10th position.
             */

            if (totalPages > 1) {

                const navigation =
                    createNavigationCard();


                productsGrid.appendChild(
                    navigation
                );


                /*
                 * Previous button
                 */

                const previousButton =
                    document.getElementById(
                        "previousProducts"
                    );


                /*
                 * Next button
                 */

                const nextButton =
                    document.getElementById(
                        "nextProducts"
                    );


                /*
                 * Page number
                 */

                const navigationPage =
                    document.getElementById(
                        "navigationPage"
                    );


                /*
                 * Product count
                 */

                const navigationCount =
                    document.getElementById(
                        "navigationCount"
                    );


                /*
                 * Disable Previous
                 * on first page.
                 */

                previousButton.disabled =
                    currentPage === 1;


                /*
                 * Disable Next
                 * on last page.
                 */

                nextButton.disabled =
                    currentPage === totalPages;


                /*
                 * Update page text.
                 */

                navigationPage.textContent =
                    `Page ${currentPage} of ${totalPages}`;


                /*
                 * Number of products
                 * currently displayed.
                 */

                navigationCount.textContent =
                    `${pageProducts.length} products`;


                /*
                 * Previous click.
                 */

                previousButton.onclick =
                    function(event) {

                        event.stopPropagation();

                        if (
                            currentPage > 1
                        ) {

                            currentPage--;

                            renderProducts();

                        }

                    };


                /*
                 * Next click.
                 */

                nextButton.onclick =
                    function(event) {

                        event.stopPropagation();

                        if (
                            currentPage <
                            totalPages
                        ) {

                            currentPage++;

                            renderProducts();

                        }

                    };

            }


            /*
             * Update header count.
             */

            if (products.length === 0) {

                productsCount.textContent =
                    "0 products";

            } else {

                productsCount.textContent =
                    `${startIndex + 1}–${endIndex} of ${products.length} products`;

            }


            /*
             * Remove loading state.
             */

            productsGrid.classList.remove(
                "loading"
            );


        }, 120);

    }


    /* =========================================================
       INITIAL RENDER
    ========================================================= */

    renderProducts();

</script>
