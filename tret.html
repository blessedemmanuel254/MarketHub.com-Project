<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kenyan Kiosk Shelf</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#dfe7ef;
    min-height:100vh;
}

/* HEADER */
.header{
    background:#5a3212;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}

/* CONTAINER */
.container{
    width:95%;
    max-width:1400px;
    margin:auto;
    padding:30px 0;
}

/* SHOP */
.shop{
    background:#f7f4ef;
    border:10px solid #7b4a23;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* SHELF */
.shelf{
    position:relative;
    background:#8b5a2b;
    height:240px;
    margin-bottom:50px;
    border-radius:10px;
    display:flex;
    align-items:flex-end;
    justify-content:space-evenly;
    padding:20px;
}

/* bottom wood */
.shelf::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-15px;
    width:100%;
    height:15px;
    background:#5a3212;
    border-radius:0 0 10px 10px;
}

/* partitions */
.partition{
    width:8px;
    height:100%;
    background:#5a3212;
    border-radius:5px;
}

/* PRODUCT */
.product{
    width:170px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    cursor:pointer;
    transition:0.3s;
}

.product:hover{
    transform:translateY(-10px) scale(1.05);
}

.product img{
    width:100%;
    height:180px;
    object-fit:contain;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,0.35));
}

/* CUSTOMER WINDOW */
.window{
    margin-top:40px;
    background:#5a3212;
    height:130px;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

/* OVERLAY */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    z-index:100;
}

.overlay.active{
    display:block;
}

/* DETAILS PANEL */
.panel{
    position:fixed;
    top:0;
    right:-450px;
    width:420px;
    height:100vh;
    background:white;
    z-index:101;
    transition:0.4s;
    padding:30px;
    overflow-y:auto;
    box-shadow:-10px 0 30px rgba(0,0,0,0.25);
}

.panel.active{
    right:0;
}

.close-btn{
    position:absolute;
    top:15px;
    right:20px;
    font-size:32px;
    cursor:pointer;
    color:#444;
}

.title{
    font-size:30px;
    margin-bottom:10px;
    color:#222;
}

.description{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

.preview{
    text-align:center;
    margin:20px 0;
}

.preview img{
    width:230px;
    height:230px;
    object-fit:contain;
}

.price{
    font-size:32px;
    font-weight:bold;
    margin-bottom:25px;
    color:#111;
}

/* FORM */
.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.order-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#27ae60;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.order-btn:hover{
    background:#1f8d4d;
}

/* MOBILE */
@media(max-width:768px){

    .panel{
        width:100%;
    }

    .shelf{
        overflow-x:auto;
        gap:25px;
    }

    .product{
        min-width:140px;
    }

}

</style>
</head>
<body>

<div class="header">
    KENYAN MINI KIOSK
</div>

<div class="container">

    <div class="shop">

        <!-- SHELF 1 -->
        <div class="shelf">

            <div class="product"
                 data-name="Sossi Sausage"
                 data-price="40"
                 data-image="https://i.imgur.com/o8QZ7hT.png">

                <img src="https://i.imgur.com/o8QZ7hT.png">
            </div>

            <div class="partition"></div>

            <div class="product"
                 data-name="Jogoo Maize Flour"
                 data-price="230"
                 data-image="https://i.imgur.com/4w7K0bE.png">

                <img src="https://i.imgur.com/4w7K0bE.png">
            </div>

            <div class="partition"></div>

            <div class="product"
                 data-name="KCC Milk"
                 data-price="70"
                 data-image="https://i.imgur.com/H9rM6mP.png">

                <img src="https://i.imgur.com/H9rM6mP.png">
            </div>

        </div>

        <!-- SHELF 2 -->
        <div class="shelf">

            <div class="product"
                 data-name="Fanta Orange"
                 data-price="60"
                 data-image="https://i.imgur.com/N5uCbDu.png">

                <img src="https://i.imgur.com/N5uCbDu.png">
            </div>

            <div class="partition"></div>

            <div class="product"
                 data-name="Indomie Noodles"
                 data-price="55"
                 data-image="https://i.imgur.com/V6tP4eL.png">

                <img src="https://i.imgur.com/V6tP4eL.png">
            </div>

            <div class="partition"></div>

            <div class="product"
                 data-name="Blue Band"
                 data-price="180"
                 data-image="https://i.imgur.com/qVn7X8H.png">

                <img src="https://i.imgur.com/qVn7X8H.png">
            </div>

        </div>

        <!-- SHELF 3 -->
        <div class="shelf">

            <div class="product"
                 data-name="Ketepa Tea"
                 data-price="120"
                 data-image="https://i.imgur.com/cxLwz7P.png">

                <img src="https://i.imgur.com/cxLwz7P.png">
            </div>

            <div class="partition"></div>

            <div class="product"
                 data-name="Royco Mchuzi Mix"
                 data-price="25"
                 data-image="https://i.imgur.com/Fh9F0YQ.png">

                <img src="https://i.imgur.com/Fh9F0YQ.png">
            </div>

            <div class="partition"></div>

            <div class="product"
                 data-name="Ajab Wheat Flour"
                 data-price="210"
                 data-image="https://i.imgur.com/qv8I8vx.png">

                <img src="https://i.imgur.com/qv8I8vx.png">
            </div>

        </div>

        <!-- CUSTOMER WINDOW -->
        <div class="window">
            CUSTOMER ORDERING WINDOW
        </div>

    </div>

</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- DETAILS PANEL -->
<div class="panel" id="panel">

    <div class="close-btn" id="closeBtn">&times;</div>

    <h2 class="title" id="productName">
        Product Name
    </h2>

    <p class="description">
        Select your preferred options and place your order.
    </p>

    <div class="preview">
        <img id="previewImage" src="">
    </div>

    <div class="price" id="productPrice">
        KES 0
    </div>

    <!-- COLOR -->
    <div class="form-group">

        <label>Color</label>

        <select id="color">
            <option>Default Packaging</option>
            <option>Red</option>
            <option>Blue</option>
            <option>Green</option>
        </select>

    </div>

    <!-- SIZE -->
    <div class="form-group">

        <label>Size</label>

        <select id="size">
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
        </select>

    </div>

    <!-- QUANTITY -->
    <div class="form-group">

        <label>Quantity</label>

        <input type="number"
               id="quantity"
               value="1"
               min="1">

    </div>

    <button class="order-btn" id="orderBtn">
        Place Order
    </button>

</div>

<script>

const products = document.querySelectorAll(".product");

const panel = document.getElementById("panel");
const overlay = document.getElementById("overlay");

const productName = document.getElementById("productName");
const productPrice = document.getElementById("productPrice");
const previewImage = document.getElementById("previewImage");

const closeBtn = document.getElementById("closeBtn");

const color = document.getElementById("color");
const size = document.getElementById("size");
const quantity = document.getElementById("quantity");

const orderBtn = document.getElementById("orderBtn");

let currentProduct = "";

/* OPEN PRODUCT PANEL */
products.forEach(product => {

    product.addEventListener("click", () => {

        currentProduct = product.dataset.name;

        productName.textContent =
            product.dataset.name;

        productPrice.textContent =
            "KES " + product.dataset.price;

        previewImage.src =
            product.dataset.image;

        panel.classList.add("active");
        overlay.classList.add("active");

    });

});

/* CLOSE PANEL */
function closePanel(){

    panel.classList.remove("active");
    overlay.classList.remove("active");

}

closeBtn.addEventListener("click", closePanel);

overlay.addEventListener("click", closePanel);

/* PLACE ORDER */
orderBtn.addEventListener("click", () => {

    alert(
        "ORDER PLACED SUCCESSFULLY!\n\n" +
        "Product: " + currentProduct + "\n" +
        "Color: " + color.value + "\n" +
        "Size: " + size.value + "\n" +
        "Quantity: " + quantity.value
    );

    closePanel();

});

</script>

</body>
</html>
