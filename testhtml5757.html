<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>28 Day Battery</title>

<style>

/* =========================================================
   PAGE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f5f5f5;

    font-family: Arial, sans-serif;
}


/* =========================================================
   DAYS BATTERY
========================================================= */

.days-battery-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
}


/* =========================================================
   BATTERY BODY
========================================================= */

.days-battery {
    position: relative;

    width: 100px;
    height: 46px;

    border: 3px solid #333;
    border-radius: 8px;

    background: #fff;

    padding: 3px;

    overflow: hidden;
}


/* =========================================================
   BATTERY TERMINAL
========================================================= */

.days-battery::after {
    content: "";

    position: absolute;

    right: -8px;
    top: 50%;

    width: 7px;
    height: 18px;

    transform: translateY(-50%);

    background: #333;

    border-radius: 0 4px 4px 0;
}


/* =========================================================
   BATTERY FILL
========================================================= */

.days-battery-fill {
    height: 100%;

    width: 100%;

    background: #088000;

    border-radius: 4px;

    transition:
        width 0.8s ease,
        background 0.4s ease;

    position: relative;

    overflow: hidden;
}


/* =========================================================
   SHINE / CHARGING EFFECT
========================================================= */

.days-battery-fill::after {

    content: "";

    position: absolute;

    top: 0;
    left: -40%;

    width: 30%;
    height: 100%;

    background: rgba(255,255,255,0.25);

    transform: skewX(-20deg);

    animation: batteryShine 2.5s infinite;
}


@keyframes batteryShine {

    0% {
        left: -40%;
    }

    100% {
        left: 130%;
    }

}


/* =========================================================
   DAYS TEXT
========================================================= */

.days-value {
    min-width: 65px;

    font-size: 16px;

    font-weight: 600;

    color: #333;

    white-space: nowrap;
}


/* =========================================================
   OPTIONAL LABEL
========================================================= */

.days-label {
    font-size: 12px;
    color: #898888;
}


/* =========================================================
   BATTERY STATES
========================================================= */

.days-battery.low .days-battery-fill {
    background: #856404;
}


.days-battery.critical .days-battery-fill {
    background: #ff3b3b;
}


.days-battery.empty .days-battery-fill {
    background: transparent;
}


/* =========================================================
   DEMO CONTROLS
========================================================= */

.demo-controls {

    position: absolute;

    bottom: 30px;

    display: flex;

    align-items: center;

    gap: 8px;
}


.demo-controls button {

    border: 1px solid #ccc;

    background: white;

    padding: 7px 12px;

    border-radius: 5px;

    cursor: pointer;
}


.demo-controls button:hover {

    background: #eee;
}

</style>
</head>


<body>


<!-- =======================================================
     BATTERY
======================================================= -->

<div class="days-battery-wrapper">

    <div
        class="days-battery"
        id="daysBattery"
    >

        <div
            class="days-battery-fill"
            id="daysBatteryFill"
        ></div>

    </div>


    <div>

        <div
            class="days-value"
            id="daysValue"
        >
            28 days
        </div>

        <div class="days-label">
            remaining
        </div>

    </div>

</div>



<!-- =======================================================
     DEMO CONTROLS
======================================================= -->

<div class="demo-controls">

    <button onclick="changeDays(-1)">
        − 1 Day
    </button>

    <button onclick="changeDays(1)">
        + 1 Day
    </button>

    <button onclick="setDays(28)">
        Full
    </button>

    <button onclick="setDays(0)">
        Empty
    </button>

</div>



<script>

/* =========================================================
   DAYS BATTERY
========================================================= */

const MAX_DAYS = 28;

let remainingDays = 28;


/* =========================================================
   UPDATE BATTERY
========================================================= */

function updateDaysBattery(days) {

    /*
     * Keep the value between 0 and 28.
     */

    days = Math.max(
        0,
        Math.min(MAX_DAYS, Number(days))
    );


    remainingDays = days;


    /*
     * Calculate percentage.
     *
     * 28 days = 100%
     * 14 days = 50%
     * 7 days  = 25%
     */

    const percentage =
        (days / MAX_DAYS) * 100;


    const battery =
        document.getElementById(
            "daysBattery"
        );


    const fill =
        document.getElementById(
            "daysBatteryFill"
        );


    const value =
        document.getElementById(
            "daysValue"
        );


    /*
     * Update fill.
     */

    fill.style.width =
        percentage + "%";


    /*
     * Update text.
     */

    value.textContent =
        days === 1
            ? "1 day"
            : days + " days";


    /*
     * Remove previous states.
     */

    battery.classList.remove(
        "low",
        "critical",
        "empty"
    );


    /*
     * Battery state.
     */

    if (days === 0) {

        battery.classList.add(
            "empty"
        );

    }

    else if (days <= 5) {

        battery.classList.add(
            "critical"
        );

    }

    else if (days <= 10) {

        battery.classList.add(
            "low"
        );

    }

}


/* =========================================================
   CHANGE DAYS
========================================================= */

function changeDays(amount) {

    updateDaysBattery(
        remainingDays + amount
    );

}


/* =========================================================
   SET DAYS
========================================================= */

function setDays(days) {

    updateDaysBattery(days);

}


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        updateDaysBattery(
            remainingDays
        );

    }
);

</script>

</body>
</html>
