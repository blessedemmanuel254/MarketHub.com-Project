
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makethub | Marketplace</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green: #088000;
    --green-dark: #066500;
    --black: #111111;
    --white: #ffffff;
    --gray: #f4f5f5;
    --text: #222222;
    --muted: #777777;
    --border: #eeeeee;
    --orange: #ff6a24;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f6;
    color: var(--text);
}

button, input {
    font-family: inherit;
}

button {
    cursor: pointer;
    border: none;
}

img {
    width: 100%;
    display: block;
    object-fit: cover;
}

.container {
    max-width: 1250px;
    margin: auto;
}

/* HEADER */

.header {
    background: var(--black);
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-top {
    padding: 15px 18px 10px;
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: 1250px;
    margin: auto;
}

.logo {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 145px;
    font-weight: 900;
    font-size: 25px;
    letter-spacing: -1px;
    color: white;
}

.logo-icon {
    width: 35px;
    height: 35px;
    background: var(--green);
    border-radius: 9px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: 900;
    font-size: 23px;
}

.logo span {
    color: #62cf50;
}

.search-box {
    flex: 1;
    position: relative;
}

.search-box input {
    width: 100%;
    height: 46px;
    border-radius: 9px;
    border: none;
    padding: 0 48px 0 45px;
    background: #fff;
    font-size: 15px;
    outline: none;
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 12px;
    font-size: 20px;
    color: #777;
}

.search-clear {
    position: absolute;
    right: 15px;
    top: 12px;
    color: #888;
    display: none;
    background: none;
}

.header-actions {
    display: flex;
    gap: 18px;
    align-items: center;
}

.header-action {
    color: white;
    background: none;
    font-size: 13px;
    text-align: center;
    position: relative;
}

.header-action .icon {
    font-size: 22px;
    display: block;
    margin-bottom: 3px;
}

.cart-count {
    position: absolute;
    top: -4px;
    right: -9px;
    background: #e53935;
    color: white;
    font-size: 10px;
    padding: 3px 5px;
    border-radius: 20px;
    display: none;
}

/* MAIN TABS */

.main-tabs {
    display: flex;
    max-width: 1250px;
    margin: auto;
    padding: 0 18px;
    overflow-x: auto;
    scrollbar-width: none;
}

.main-tabs::-webkit-scrollbar {
    display: none;
}

.main-tab {
    padding: 15px 25px;
    background: transparent;
    color: #aaa;
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
}

.main-tab.active {
    color: white;
    border-color: #39b32b;
}

.main-tab .tab-icon {
    margin-right: 7px;
}

/* CATEGORY NAV */

.category-bar {
    background: white;
    border-bottom: 1px solid var(--border);
}

.categories {
    max-width: 1250px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    overflow-x: auto;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category-chip {
    padding: 9px 16px;
    background: #f4f4f4;
    border-radius: 25px;
    white-space: nowrap;
    color: #555;
    font-size: 13px;
    transition: .2s;
}

.category-chip.active {
    background: var(--green);
    color: white;
}

/* PAGE */

.page {
    padding: 16px;
}

.section {
    margin-bottom: 22px;
}

/* PROMO */

.promo {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    height: 220px;
    background: #173d21;
    color: white;
}

.promo img {
    height: 100%;
    position: absolute;
    inset: 0;
}

.promo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
        rgba(0,0,0,.83) 0%,
        rgba(0,0,0,.45) 48%,
        rgba(0,0,0,.05) 100%);
}

.promo-content {
    position: relative;
    z-index: 2;
    padding: 28px;
    max-width: 500px;
}

.promo-label {
    display: inline-block;
    background: #ff6a24;
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 12px;
}

.promo h1 {
    font-size: 30px;
    line-height: 1.1;
    margin-bottom: 8px;
}

.promo p {
    color: #eee;
    font-size: 13px;
    margin-bottom: 18px;
}

.promo-btn {
    background: white;
    color: #111;
    padding: 11px 17px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
}

.promo-dots {
    position: absolute;
    bottom: 14px;
    left: 28px;
    z-index: 3;
    display: flex;
    gap: 5px;
}

.dot {
    height: 6px;
    width: 6px;
    background: #aaa;
    border-radius: 50%;
}

.dot.active {
    background: white;
    width: 19px;
    border-radius: 10px;
}

/* QUICK LINKS */

.quick-links {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.quick-link {
    background: white;
    padding: 15px 7px;
    text-align: center;
    border-radius: 10px;
    color: #333;
    transition: .2s;
}

.quick-link:hover {
    transform: translateY(-2px);
}

.quick-link .emoji {
    font-size: 27px;
    margin-bottom: 8px;
    display: block;
}

.quick-link span:last-child {
    font-size: 11px;
    font-weight: bold;
    line-height: 1.3;
}

/* SECTION TITLE */

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.section-heading h2 {
    font-size: 19px;
}

.see-all {
    color: var(--green);
    background: transparent;
    font-size: 13px;
    font-weight: bold;
}

/* FLASH DEAL */

.flash {
    background: white;
    padding: 15px;
    border-radius: 12px;
}

.flash-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.flash-heading h2 {
    font-size: 18px;
}

.flash-badge {
    background: #fff0e8;
    color: #ed5a22;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 4px;
    font-weight: bold;
}

.timer {
    margin-left: auto;
    display: flex;
    gap: 4px;
    align-items: center;
    font-size: 12px;
    color: #777;
}

.timer span {
    background: #222;
    color: white;
    padding: 5px;
    border-radius: 4px;
    font-weight: bold;
}

.flash-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.flash-item {
    text-align: center;
    min-width: 0;
}

.flash-item img {
    height: 115px;
    object-fit: contain;
    background: #fafafa;
    border-radius: 7px;
}

.flash-price {
    font-size: 14px;
    color: #e44848;
    font-weight: bold;
    margin-top: 8px;
}

.flash-old {
    color: #999;
    font-size: 11px;
    text-decoration: line-through;
    margin-top: 3px;
}

/* FEATURE BANNERS */

.banner-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.small-banner {
    border-radius: 12px;
    overflow: hidden;
    height: 145px;
    position: relative;
    background: #333;
    color: white;
}

.small-banner img {
    height: 100%;
}

.small-banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.7), transparent 80%);
}

.small-banner-content {
    position: absolute;
    z-index: 2;
    bottom: 12px;
    left: 13px;
}

.small-banner h3 {
    font-size: 16px;
    margin-bottom: 4px;
}

.small-banner p {
    font-size: 11px;
}

/* PRODUCT GRID */

.product-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    transition: .2s;
}

.product-card:hover {
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.product-image {
    position: relative;
    background: #f8f8f8;
    height: 190px;
    overflow: hidden;
}

.product-image img {
    height: 100%;
    object-fit: contain;
    transition: transform .3s;
}

.product-card:hover .product-image img {
    transform: scale(1.04);
}

.discount {
    position: absolute;
    left: 8px;
    top: 8px;
    background: #ed4848;
    color: white;
    font-size: 10px;
    padding: 5px 7px;
    border-radius: 4px;
    font-weight: bold;
}

.favorite {
    position: absolute;
    right: 8px;
    top: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,.95);
    font-size: 16px;
    color: #777;
}

.favorite.active {
    color: #e44848;
}

.product-info {
    padding: 11px;
}

.product-title {
    font-size: 13px;
    line-height: 1.4;
    height: 37px;
    overflow: hidden;
    margin-bottom: 7px;
}

.product-price {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
}

.old-price {
    color: #999;
    font-size: 11px;
    text-decoration: line-through;
    margin-left: 5px;
}

.rating {
    color: #f39b16;
    font-size: 11px;
    margin-bottom: 8px;
}

.rating span {
    color: #999;
    margin-left: 3px;
}

.delivery {
    color: #13864a;
    font-size: 10px;
    font-weight: bold;
    margin-bottom: 8px;
}

.add-cart {
    width: 100%;
    padding: 9px;
    background: #f0f8ef;
    border: 1px solid #d7ecd3;
    color: var(--green);
    border-radius: 6px;
    font-weight: bold;
    font-size: 12px;
}

.add-cart:hover {
    background: var(--green);
    color: white;
}

/* SERVICE CARDS */

.service-card {
    background: white;
    padding: 13px;
    border-radius: 12px;
}

.service-card img {
    height: 150px;
    border-radius: 8px;
}

.service-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #edf8eb;
    display: grid;
    place-items: center;
    font-size: 20px;
    margin: 10px 0;
}

.service-card h3 {
    font-size: 14px;
    margin-bottom: 5px;
}

.service-card p {
    color: #777;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 8px;
}

.service-price {
    color: var(--green);
    font-weight: bold;
    font-size: 15px;
}

.service-rating {
    color: #f39b16;
    font-size: 12px;
    margin-top: 8px;
}

/* REAL ESTATE */

.property-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
}

.property-image {
    height: 200px;
    position: relative;
}

.property-image img {
    height: 100%;
}

.property-tag {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 6px 9px;
    background: var(--green);
    color: white;
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
}

.property-info {
    padding: 12px;
}

.property-info h3 {
    font-size: 14px;
    margin-bottom: 7px;
}

.location {
    color: #777;
    font-size: 12px;
    margin-bottom: 9px;
}

.property-price {
    font-size: 17px;
    font-weight: bold;
    color: var(--green);
}

.property-features {
    display: flex;
    gap: 10px;
    border-top: 1px solid #eee;
    padding-top: 10px;
    margin-top: 10px;
    color: #666;
    font-size: 11px;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 50px 15px;
    background: white;
    border-radius: 12px;
    color: #777;
    grid-column: 1 / -1;
}

.empty div {
    font-size: 35px;
    margin-bottom: 10px;
}

/* BOTTOM NAV */

.bottom-nav {
    background: white;
    border-top: 1px solid #e8e8e8;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: none;
}

.bottom-nav-inner {
    max-width: 700px;
    margin: auto;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 5px;
}

.nav-item {
    background: transparent;
    color: #777;
    font-size: 10px;
    min-width: 55px;
    text-align: center;
}

.nav-item .nav-icon {
    display: block;
    font-size: 22px;
    margin-bottom: 4px;
}

.nav-item.active {
    color: var(--green);
    font-weight: bold;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 12px 18px;
    border-radius: 30px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: .3s;
    pointer-events: none;
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
}

/* DESKTOP */

@media (min-width: 700px) {
    .page {
        padding: 22px;
    }

    .promo {
        height: 300px;
    }

    .promo-content {
        padding: 45px;
    }

    .promo h1 {
        font-size: 42px;
    }

    .quick-links {
        grid-template-columns: repeat(8, 1fr);
    }

    .quick-link {
        padding: 20px 10px;
    }

    .quick-link .emoji {
        font-size: 30px;
    }

    .quick-link span:last-child {
        font-size: 12px;
    }

    .product-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 15px;
    }

    .product-image {
        height: 230px;
    }

    .flash-item img {
        height: 170px;
    }

    .small-banner {
        height: 210px;
    }

    .service-card img {
        height: 200px;
    }

    .property-image {
        height: 230px;
    }

    .bottom-nav {
        display: none !important;
    }

    .page {
        padding-bottom: 30px;
    }
}

@media (min-width: 1050px) {
    .product-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .main-tabs {
        padding-left: 0;
    }

    .categories {
        padding-left: 0;
    }
}

@media (max-width: 699px) {
    .header-top {
        padding: 12px;
        gap: 10px;
    }

    .logo {
        min-width: auto;
        font-size: 21px;
    }

    .logo-icon {
        width: 31px;
        height: 31px;
    }

    .header-actions {
        display: none;
    }

    .main-tabs {
        padding: 0 10px;
    }

    .main-tab {
        flex: 1;
        padding: 14px 9px;
        font-size: 13px;
        text-align: center;
    }

    .categories {
        padding: 10px 12px;
    }

    .page {
        padding: 12px;
        padding-bottom: 85px;
    }

    .promo {
        height: 185px;
    }

    .promo-content {
        padding: 23px 18px;
    }

    .promo h1 {
        font-size: 25px;
    }

    .promo p {
        font-size: 12px;
    }

    .quick-links {
        gap: 7px;
    }

    .quick-link {
        padding: 12px 5px;
    }

    .quick-link .emoji {
        font-size: 22px;
    }

    .quick-link span:last-child {
        font-size: 10px;
    }

    .flash {
        padding: 12px;
    }

    .flash-item img {
        height: 85px;
    }

    .flash-price {
        font-size: 12px;
    }

    .small-banner {
        height: 120px;
    }

    .small-banner h3 {
        font-size: 13px;
    }

    .product-image {
        height: 165px;
    }

    .bottom-nav {
        display: block;
    }
}

@media (max-width: 380px) {
    .logo {
        font-size: 18px;
    }

    .logo-icon {
        width: 28px;
        height: 28px;
    }

    .search-box input {
        height: 40px;
        font-size: 13px;
    }

    .main-tab {
        font-size: 12px;
        padding: 13px 6px;
    }

    .product-image {
        height: 145px;
    }

    .product-price {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="header-top">

        <div class="logo">
            <div class="logo-icon">M</div>
            Make<span>thub</span>
        </div>

        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input id="searchInput" type="search"
                   placeholder="Search products, services, properties...">
            <button class="search-clear" id="clearSearch">✕</button>
        </div>

        <div class="header-actions">
            <button class="header-action" onclick="showToast('Your account')">
                <span class="icon">♙</span>
                Account
            </button>

            <button class="header-action" onclick="showToast('Your cart')">
                <span class="icon">🛒</span>
                Cart
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>

    </div>

    <!-- MAJOR MARKETPLACE TABS -->
    <div class="main-tabs">

        <button class="main-tab active" data-tab="products">
            <span class="tab-icon">▣</span> Products
        </button>

        <button class="main-tab" data-tab="services">
            <span class="tab-icon">⚙</span> Services
        </button>

        <button class="main-tab" data-tab="realestate">
            <span class="tab-icon">⌂</span> Real Estate
        </button>

    </div>

</header>

<!-- CATEGORY BAR -->
<div class="category-bar">
    <div class="categories" id="categories"></div>
</div>

<!-- MAIN CONTENT -->
<main class="container page">

    <!-- PROMO -->
    <section class="section">
        <div class="promo" id="promo">

            <img id="promoImage"
                 src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1400&q=85"
                 alt="Marketplace promotion">

            <div class="promo-content">
                <span class="promo-label" id="promoLabel">MAKETHUB DEALS</span>
                <h1 id="promoTitle">Everything you need.<br>All in one place.</h1>
                <p id="promoText">Discover great deals from businesses around you.</p>
                <button class="promo-btn" onclick="scrollToListings()">
                    Explore Now →
                </button>
            </div>

            <div class="promo-dots" id="promoDots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

        </div>
    </section>

    <!-- QUICK LINKS -->
    <section class="section">
        <div class="quick-links" id="quickLinks"></div>
    </section>

    <!-- FLASH SALE -->
    <section class="section" id="flashSection">

        <div class="flash">

            <div class="flash-heading">
                <h2>⚡ Flash Deals</h2>
                <span class="flash-badge">LIMITED OFFERS</span>

                <div class="timer">
                    Ends in
                    <span id="hours">08</span> :
                    <span id="minutes">24</span> :
                    <span id="seconds">45</span>
                </div>
            </div>

            <div class="flash-grid" id="flashGrid"></div>

        </div>

    </section>

    <!-- PROMO BANNERS -->
    <section class="section" id="bannerSection">
        <div class="banner-grid" id="bannerGrid"></div>
    </section>

    <!-- LISTINGS -->
    <section class="section" id="listingSection">

        <div class="section-heading">
            <h2 id="listingTitle">Discover Products</h2>
            <button class="see-all" onclick="resetCategory()">See all →</button>
        </div>

        <div class="product-grid" id="listingGrid"></div>

    </section>

</main>

<!-- MOBILE BOTTOM NAVIGATION -->
<nav class="bottom-nav">
    <div class="bottom-nav-inner">

        <button class="nav-item active" onclick="bottomNav('home',this)">
            <span class="nav-icon">⌂</span>Home
        </button>

        <button class="nav-item" onclick="bottomNav('categories',this)">
            <span class="nav-icon">▦</span>Categories
        </button>

        <button class="nav-item" onclick="bottomNav('messages',this)">
            <span class="nav-icon">☏</span>Messages
        </button>

        <button class="nav-item" onclick="bottomNav('cart',this)">
            <span class="nav-icon">🛒</span>Cart
        </button>

        <button class="nav-item" onclick="bottomNav('account',this)">
            <span class="nav-icon">♙</span>Account
        </button>

    </div>
</nav>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   MAKETHUB FRONTEND DATA
   Replace these sample listings with database/API data later.
========================================================= */

const marketplace = {

    products: {

        title: "Discover Products",

/* =========================================================
   STATE
========================================================= */

let currentTab = "products";
let currentCategory = "All";
let searchQuery = "";
let cart = 0;

const data = () => marketplace[currentTab];

/* =========================================================
   RENDER PAGE
========================================================= */

function renderPage() {

    const current = data();

    document.getElementById("searchInput").placeholder =
        current.searchPlaceholder;

    document.getElementById("listingTitle").textContent =
        current.title;

    renderCategories();
    renderPromo();
    renderQuickLinks();
    renderFlash();
    renderBanners();
    renderListings();
}

/* =========================================================
   CATEGORY NAVIGATION
========================================================= */

function renderCategories() {

    const categories = data().categories;

    document.getElementById("categories").innerHTML =
        categories.map(category => `
            <button class="category-chip
                ${currentCategory === category ? 'active' : ''}"
                onclick="selectCategory('${category}')">
                ${category}
            </button>
        `).join("");
}

function selectCategory(category) {

    currentCategory = category;

    renderCategories();
    renderListings();
}

function resetCategory() {

    currentCategory = "All";

    renderCategories();
    renderListings();
}

/* =========================================================
   PROMOTIONAL HERO
========================================================= */

function renderPromo() {

    const promo = data().promo;

    document.getElementById("promoLabel").textContent = promo.label;
    document.getElementById("promoTitle").innerHTML = promo.title;
    document.getElementById("promoText").textContent = promo.text;
    document.getElementById("promoImage").src = promo.image;
}

/* =========================================================
   QUICK LINKS
========================================================= */

function renderQuickLinks() {

    document.getElementById("quickLinks").innerHTML =
        data().quickLinks.map(item => `
            <button class="quick-link"
                onclick="selectCategory('${item[1]}')">
                <span class="emoji">${item[0]}</span>
                <span>${item[1]}</span>
            </button>
        `).join("");
}

/* =========================================================
   FLASH DEALS
========================================================= */

function renderFlash() {

    document.getElementById("flashGrid").innerHTML =
        data().flash.map(item => `
            <div class="flash-item">
                <img src="${item.image}" alt="${item.title}">
                <div class="flash-price">
                    KSh ${Number(item.price).toLocaleString()}
                </div>
                <div class="flash-old">
                    KSh ${Number(item.old).toLocaleString()}
                </div>
            </div>
        `).join("");
}

/* =========================================================
   PROMO BANNERS
========================================================= */

function renderBanners() {

    document.getElementById("bannerGrid").innerHTML =
        data().banners.map(banner => `
            <div class="small-banner">
                <img src="${banner.image}" alt="${banner.title}">
                <div class="small-banner-content">
                    <h3>${banner.title}</h3>
                    <p>${banner.text}</p>
                </div>
            </div>
        `).join("");
}

/* =========================================================
   LISTINGS
========================================================= */

function renderListings() {

    const listings = data().listings;

    const filtered = listings.filter(item => {

        const categoryMatch =
            currentCategory === "All" ||
            item.category === currentCategory ||
            item.title.toLowerCase().includes(currentCategory.toLowerCase());

        const searchMatch =
            item.title.toLowerCase().includes(searchQuery) ||
            item.category.toLowerCase().includes(searchQuery) ||
            (item.location &&
             item.location.toLowerCase().includes(searchQuery)) ||
            (item.description &&
             item.description.toLowerCase().includes(searchQuery));

        return categoryMatch && searchMatch;
    });

    if (!filtered.length) {

        document.getElementById("listingGrid").innerHTML = `
            <div class="empty">
                <div>🔎</div>
                <h3>No listings found</h3>
                <p>Try another search or category.</p>
            </div>
        `;

        return;
    }

    if (currentTab === "products") {
        renderProducts(filtered);
    }

    if (currentTab === "services") {
        renderServices(filtered);
    }

    if (currentTab === "realestate") {
        renderProperties(filtered);
    }
}

/* =========================================================
   PRODUCT CARDS
========================================================= */

function renderProducts(items) {

    document.getElementById("listingGrid").innerHTML =
        items.map((item, index) => {

            const discount = item.old
                ? Math.round((1 - item.price / item.old) * 100)
                : 0;

            return `
                <div class="product-card">

                    <div class="product-image">
                        <img src="${item.image}" alt="${item.title}">

                        ${discount ? `
                            <span class="discount">
                                -${discount}%
                            </span>
                        ` : ""}

                        <button class="favorite"
                            onclick="toggleFavorite(this)">♡</button>
                    </div>

                    <div class="product-info">

                        <div class="product-title">
                            ${item.title}
                        </div>

                        <div class="product-price">
                            KSh ${Number(item.price).toLocaleString()}

                            ${item.old ? `
                                <span class="old-price">
                                    KSh ${Number(item.old).toLocaleString()}
                                </span>
                            ` : ""}
                        </div>

                        <div class="rating">
                            ★★★★★ <span>(${item.reviews})</span>
                        </div>

                        <div class="delivery">
                            ✓ ${item.delivery || "Available"}
                        </div>

                        <button class="add-cart"
                            onclick="addToCart('${item.title}')">
                            + Add to Cart
                        </button>

                    </div>

                </div>
            `;
        }).join("");
}

/* =========================================================
   SERVICE CARDS
========================================================= */

function renderServices(items) {

    document.getElementById("listingGrid").innerHTML =
        items.map(item => `
            <div class="service-card">

                <img src="${item.image}" alt="${item.title}">

                <div class="service-icon">🛠️</div>

                <h3>${item.title}</h3>

                <p>${item.description || "Professional service available for booking."}</p>

                <div class="service-price">
                    From KSh ${Number(item.price).toLocaleString()}
                </div>

                <div class="service-rating">
                    ★★★★★ (${item.reviews})
                </div>

                <button class="add-cart"
                    style="margin-top:12px"
                    onclick="showToast('Service selected: ${item.title}')">
                    View Service
                </button>

            </div>
        `).join("");
}

/* =========================================================
   PROPERTY CARDS
========================================================= */

function renderProperties(items) {

    document.getElementById("listingGrid").innerHTML =
        items.map(item => `
            <div class="property-card">

                <div class="property-image">
                    <img src="${item.image}" alt="${item.title}">

                    <span class="property-tag">
                        ${item.category}
                    </span>

                    <button class="favorite"
                        onclick="toggleFavorite(this)">♡</button>
                </div>

                <div class="property-info">

                    <h3>${item.title}</h3>

                    <div class="location">
                        📍 ${item.location}
                    </div>

                    <div class="property-price">
                        KSh ${Number(item.price).toLocaleString()}
                        ${item.category === "Short Stay" ? "/ night" :
                          item.category === "Land" ? "" : "/ month"}
                    </div>

                    <div class="property-features">
                        ${item.features}
                    </div>

                    <button class="add-cart"
                        style="margin-top:12px"
                        onclick="showToast('Property selected')">
                        View Property
                    </button>

                </div>

            </div>
        `).join("");
}

/* =========================================================
   TAB SWITCHING
========================================================= */

document.querySelectorAll(".main-tab").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".main-tab")
            .forEach(tab => tab.classList.remove("active"));

        button.classList.add("active");

        currentTab = button.dataset.tab;
        currentCategory = "All";
        searchQuery = "";

        document.getElementById("searchInput").value = "";

        renderPage();
    });
});

/* =========================================================
   SEARCH
========================================================= */

document.getElementById("searchInput")
    .addEventListener("input", function() {

        searchQuery = this.value.toLowerCase().trim();

        document.getElementById("clearSearch").style.display =
            searchQuery ? "block" : "none";

        renderListings();
    });

document.getElementById("clearSearch")
    .addEventListener("click", function() {

        document.getElementById("searchInput").value = "";

        searchQuery = "";

        this.style.display = "none";

        renderListings();
    });

/* =========================================================
   CART
========================================================= */

function addToCart(name) {

    cart++;

    const count = document.getElementById("cartCount");

    count.textContent = cart;
    count.style.display = "block";

    showToast(name + " added to cart");
}

/* =========================================================
   FAVORITES
========================================================= */

function toggleFavorite(button) {

    button.classList.toggle("active");

    button.innerHTML =
        button.classList.contains("active") ? "♥" : "♡";

    showToast(
        button.classList.contains("active")
        ? "Added to favorites"
        : "Removed from favorites"
    );
}

/* =========================================================
   TOAST
========================================================= */

let toastTimeout;

function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}

/* =========================================================
   BOTTOM NAV
========================================================= */

function bottomNav(name, button) {

    document.querySelectorAll(".nav-item")
        .forEach(item => item.classList.remove("active"));

    button.classList.add("active");

    if (name === "home") {
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    if (name === "categories") {
        document.querySelector(".category-bar")
            .scrollIntoView({ behavior: "smooth" });
    }

    if (name === "cart") {
        showToast("Cart: " + cart + " items");
    }

    if (name === "messages") {
        showToast("Messages");
    }

    if (name === "account") {
        showToast("Account");
    }
}

/* =========================================================
   SCROLL TO LISTINGS
========================================================= */

function scrollToListings() {

    document.getElementById("listingSection")
        .scrollIntoView({ behavior: "smooth" });
}

/* =========================================================
   COUNTDOWN
========================================================= */

let countdown = 8 * 3600 + 24 * 60 + 45;

function updateCountdown() {

    if (countdown <= 0) countdown = 8 * 3600;

    const h = Math.floor(countdown / 3600);
    const m = Math.floor((countdown % 3600) / 60);
    const s = countdown % 60;

    document.getElementById("hours").textContent =
        String(h).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(m).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(s).padStart(2, "0");

    countdown--;
}

setInterval(updateCountdown, 1000);

/* =========================================================
   INITIALIZE
========================================================= */

renderPage();
updateCountdown();

</script>

</body>
</html>
